      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Тест авторизации
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: Введите "Bearer {access_token}" (без кавычек)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
