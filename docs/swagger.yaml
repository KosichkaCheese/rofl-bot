definitions:
  domain.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  domain.Bill:
    properties:
      consumer_bank:
        type: string
      consumer_id:
        type: integer
      consumer_name:
        type: string
      consumer_phone:
        type: string
      name:
        type: string
      price:
        type: number
      product_id:
        type: integer
    type: object
  domain.CreateEvent:
    properties:
      name:
        type: string
    type: object
  domain.CreateProduct:
    properties:
      bought:
        type: boolean
      consumer_id:
        type: integer
      equal:
        type: boolean
      members:
        items:
          $ref: '#/definitions/domain.CreateProductMembers'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  domain.CreateProductMembers:
    properties:
      price:
        type: number
      user_id:
        type: integer
    type: object
  domain.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  domain.Event:
    properties:
      createdAt:
        type: string
      ended:
        type: boolean
      id:
        type: integer
      invites:
        items:
          $ref: '#/definitions/domain.Invite'
        type: array
      members:
        items:
          $ref: '#/definitions/domain.EventMember'
        type: array
      name:
        type: string
      products:
        items:
          $ref: '#/definitions/domain.Product'
        type: array
      updatedAt:
        type: string
    type: object
  domain.EventMember:
    properties:
      event:
        $ref: '#/definitions/domain.Event'
      event_id:
        type: integer
      id:
        type: integer
      role:
        $ref: '#/definitions/domain.Role'
      role_id:
        type: integer
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: integer
    type: object
  domain.EventMembers:
    properties:
      role_id:
        type: integer
      role_name:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  domain.EventWithAdmin:
    properties:
      event:
        $ref: '#/definitions/domain.EventWithMembersCount'
      is_admin:
        type: boolean
    type: object
  domain.EventWithMembersCount:
    properties:
      count:
        type: integer
      event:
        $ref: '#/definitions/domain.Event'
    type: object
  domain.Invite:
    properties:
      event:
        $ref: '#/definitions/domain.Event'
      event_id:
        type: integer
      expires_at:
        type: string
      id:
        type: string
    type: object
  domain.InviteLink:
    properties:
      expires_at:
        type: string
      link:
        type: string
    type: object
  domain.Product:
    properties:
      bought:
        type: boolean
      consumer_id:
        type: integer
      createdAt:
        type: string
      equal:
        type: boolean
      event_id:
        type: integer
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/domain.ProductMember'
        type: array
      name:
        type: string
      price:
        type: number
      updatedAt:
        type: string
    type: object
  domain.ProductList:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
    type: object
  domain.ProductMember:
    properties:
      amount:
        type: number
      id:
        type: integer
      product_id:
        type: integer
      user:
        $ref: '#/definitions/domain.User'
      user_id:
        type: integer
    type: object
  domain.ProductMemberResponse:
    properties:
      price:
        type: number
      user_id:
        type: integer
      username:
        type: string
    type: object
  domain.ProductResponse:
    properties:
      bought:
        type: boolean
      consumer_id:
        type: integer
      consumer_username:
        type: string
      equal:
        type: boolean
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/domain.ProductMemberResponse'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  domain.Role:
    properties:
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/domain.EventMember'
        type: array
      name:
        type: string
    type: object
  domain.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  domain.UpdateEvent:
    properties:
      ended:
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  domain.UpdateProduct:
    properties:
      bought:
        type: boolean
      consumer_id:
        type: integer
      equal:
        type: boolean
      members:
        items:
          $ref: '#/definitions/domain.UpdateProductMember'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  domain.UpdateProductMember:
    properties:
      price:
        type: number
      user_id:
        type: integer
    type: object
  domain.UpdateUser:
    properties:
      bank:
        description: Id          uint    `json:"id" gorm:"primaryKey;not null;unique"`
        type: string
      phone_number:
        type: string
    type: object
  domain.User:
    properties:
      bank:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: API для tg Mini App "Приколы у Алёны"
  title: Rofl Bot API
  version: "1.0"
paths:
  /alena-rofl/:
    get:
      description: Проверяет, жив ли сервер
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Проверка жизнеспособности сервера
  /alena-rofl/auth:
    post:
      consumes:
      - application/json
      description: Проверяет initData и выдаёт access + refresh токены
      parameters:
      - description: Init Data
        in: body
        name: InitData
        required: true
        schema:
          properties:
            init_data:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Авторизация через Telegram
      tags:
      - auth
  /alena-rofl/clear:
    delete:
      consumes:
      - application/json
      description: Удаление всех refresh токенов пользователя
      parameters:
      - description: User ID
        in: body
        name: user_id
        required: true
        schema:
          properties:
            user_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Удаление токенов
      tags:
      - auth
  /alena-rofl/event:
    post:
      consumes:
      - application/json
      description: Создает событие, при успехе возвращает id. авторизованный пользователь
        становится админом события.
      parameters:
      - description: Event
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/domain.CreateEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание события
      tags:
      - event
    put:
      consumes:
      - application/json
      description: Можно изменить название или завершенность. оба параметра необязательны.
        !Изменить событие может только его админ!
      parameters:
      - description: Event
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление события
      tags:
      - event
  /alena-rofl/event/{event_id}/product/{product_id}:
    delete:
      consumes:
      - application/json
      description: по id ивента и товара удаляет товар. !не работает, если запрашивает
        не админ ивента!
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: integer
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление товара
      tags:
      - product
    get:
      consumes:
      - application/json
      description: по id ивента и товара выдает товар. !не работает, если запрашивает
        не участник ивента!
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: integer
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение товара
      tags:
      - product
    put:
      consumes:
      - application/json
      description: по id ивента и товара обновляет товар. !не работает, если запрашивает
        не участник ивента!
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: integer
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateProduct'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновление товара
      tags:
      - product
  /alena-rofl/event/{id}:
    delete:
      consumes:
      - application/json
      description: по id удаляет событие. !Удалить событие может только его админ!
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удаление события
      tags:
      - event
    get:
      consumes:
      - application/json
      description: по id выдает событие. !не работает, если запрашивает не участник
        ивента!
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.EventWithAdmin'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение события
      tags:
      - event
  /alena-rofl/event/{id}/admin:
    get:
      consumes:
      - application/json
      description: по id события выдает админа. !не работает, если запрашивает не
        участник ивента!
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение админа события
      tags:
      - event
  /alena-rofl/event/{id}/bill:
    get:
      consumes:
      - application/json
      description: Выдает счет пользователя по id ивента. В счет не входят товары,
        которые купил сам пользователь
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Bill'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение счета для текущего пользователя
      tags:
      - product
  /alena-rofl/event/{id}/invite:
    post:
      consumes:
      - application/json
      description: Создает ссылку для приглашения в ивент с указанным id. не работает,
        если пользователь не участник ивента. Ссылка живет 24 часа, при повторном
        использовании старая ссылка заменяется на новую.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.InviteLink'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание ссылки для приглашения
      tags:
      - event
  /alena-rofl/event/{id}/leave:
    put:
      consumes:
      - application/json
      description: по id ивента удаляет из него авторизованного пользователя. !не
        работает, если пользователь не участник ивента!
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Покинуть ивент
      tags:
      - event
  /alena-rofl/event/{id}/members:
    get:
      consumes:
      - application/json
      description: по id ивента получает всех участников !не работает, если пользователь
        не участник ивента!
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.EventMembers'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение участников ивента
      tags:
      - event
  /alena-rofl/event/{id}/product:
    post:
      consumes:
      - application/json
      description: Создает товар, при успехе возвращает id. Не работает, если создает
        не участнк события.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProduct'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создание товара
      tags:
      - product
  /alena-rofl/event/{id}/products:
    get:
      consumes:
      - application/json
      description: выдает все товары по id ивента. не работает, если пользователь
        не участник ивента
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ProductList'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение всех товаров в ивенте
      tags:
      - product
  /alena-rofl/events:
    get:
      consumes:
      - application/json
      description: выдает все ивенты авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.EventWithMembersCount'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение всех ивентов текущего юзера
      tags:
      - event
  /alena-rofl/invite/{id}:
    post:
      consumes:
      - application/json
      description: по id invite-ссылки присоединяет авторизованного пользователя к
        ивенту. не работает для пользователей, которые уже состоят в этом ивенте.
      parameters:
      - description: Invite ID (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
